[project]
name = "socratic-tutor-backend"
version = "0.1.0"
description = "Socratic Tutor backend — FastAPI + OpenRouter"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
    "flask>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
math = [
    "sympy>=1.13",
    "matplotlib>=3.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "specializations*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that call the real LLM (deselect with --run-slow)",
]
